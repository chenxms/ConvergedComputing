# Nginx配置文件示例 - 用于解决CORS问题
# 请将此配置提供给运维团队

server {
    listen 80;
    server_name 117.72.14.166;

    # 日志配置
    access_log /var/log/nginx/converged_computing_access.log;
    error_log /var/log/nginx/converged_computing_error.log;

    # API反向代理配置
    location /api/ {
        # 反向代理到后端服务
        proxy_pass http://127.0.0.1:8010;

        # 重要：传递原始请求头
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 处理OPTIONS预检请求
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' '*' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS, PATCH' always;
            add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization' always;
            add_header 'Access-Control-Allow-Credentials' 'true' always;
            add_header 'Access-Control-Max-Age' 3600 always;
            add_header 'Content-Type' 'text/plain; charset=utf-8' always;
            add_header 'Content-Length' 0 always;
            return 204;
        }

        # 添加CORS头（对所有请求）
        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS, PATCH' always;
        add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization' always;
        add_header 'Access-Control-Allow-Credentials' 'true' always;
        add_header 'Access-Control-Expose-Headers' 'Content-Length,Content-Range' always;

        # 代理超时设置
        proxy_connect_timeout 600s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;

        # 缓冲区设置
        proxy_buffering off;
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;
    }

    # 健康检查端点
    location /health {
        proxy_pass http://127.0.0.1:8010/health;
    }
}

# 如果使用upstream负载均衡
upstream converged_computing_backend {
    server 127.0.0.1:8010;
    # 可以添加更多后端服务器
    # server 127.0.0.1:8011;
    # server 127.0.0.1:8012;

    # 健康检查配置
    keepalive 32;
}