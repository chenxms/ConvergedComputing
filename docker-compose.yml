services:
  # 涓诲簲鐢ㄦ湇鍔?
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: converged-computing-app
    restart: unless-stopped
    ports:
      - "8010:8000"
    command: ["python", "-m", "uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "4"]
    environment:
      # 鏁版嵁搴撻厤缃?
      DATABASE_URL: ${DATABASE_URL:-mysql+pymysql://root:mysql_Lujing2022@117.72.14.166:23506/appraisal_test?charset=utf8mb4}
      
      # 搴旂敤閰嶇疆
      PYTHONPATH: /app
      APP_ENV: ${APP_ENV:-production}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      
      # 鎬ц兘閰嶇疆
      WORKERS: ${WORKERS:-4}
      MAX_CONNECTIONS: ${MAX_CONNECTIONS:-100}
      POOL_SIZE: ${POOL_SIZE:-20}
      POOL_RECYCLE: ${POOL_RECYCLE:-3600}
      
      # 鎵瑰鐞嗛厤缃?
      BATCH_SIZE: ${BATCH_SIZE:-10}
      BATCH_TIMEOUT: ${BATCH_TIMEOUT:-300}
      # 鍐欏叆闃绘柇锛氬凡瑙ｉ櫎瀵?G7-2025 鐨勫啓鍏ラ檺鍒?
      DISABLE_WRITES_FOR_BATCHES: ${DISABLE_WRITES_FOR_BATCHES:-}

      # Redis缓存配置
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_DB: 0

    volumes:
      # 鏃ュ織鐩綍
      - ./logs:/app/logs
      # 涓存椂鏂囦欢鐩綍
      - ./temp:/app/temp
      # 鏂囨。鐩綍锛堝彧璇伙級
      - ./docs:/app/docs:ro
      # 楠岃瘉鎶ュ憡杈撳嚭
      - ./reports:/app/reports
      # 测试目录（只读）
      - ./tests:/app/tests:ro
      
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
      
    networks:
      - converged-network
    
    # 璧勬簮闄愬埗
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 4G
        reservations:
          cpus: '1'
          memory: 2G

  subjects:
    image: convergedcomputing-app:latest
    container_name: subjects-v12-api
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:-mysql+pymysql://root:mysql_Lujing2022@117.72.14.166:23506/appraisal_test?charset=utf8mb4}
      PYTHONPATH: /app
      # 涓庝富搴旂敤淇濇寔涓€鑷寸殑鍐欏叆闃绘柇绛栫暐锛堝凡瑙ｉ櫎G7-2025闄愬埗锛?
      DISABLE_WRITES_FOR_BATCHES: ${DISABLE_WRITES_FOR_BATCHES:-}
      # Redis缓存配置
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_DB: 0
    command: ["python", "-m", "uvicorn", "app.subjects_api_main:app", "--host", "0.0.0.0", "--port", "8001", "--workers", "2"]
    ports:
      - "8011:8001"
    volumes:
      - ./app:/app/app:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - converged-network

  # 鎵瑰鐞嗕换鍔℃墽琛屽櫒
  batch-processor:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: converged-batch-processor
    # 淇锛氶伩鍏嶆垚鍔熼€€鍑哄悗琚獶ocker瀹堟姢杩涚▼鍙嶅鎷夎捣锛屽鑷撮噸澶嶆眹鑱?
    restart: "no"
    environment:
      DATABASE_URL: ${DATABASE_URL:-mysql+pymysql://root:mysql_Lujing2022@117.72.14.166:23506/appraisal_test?charset=utf8mb4}
      PYTHONPATH: /app
      BATCH_MODE: "true"
      # 鎵瑰鐞嗗啓鍏ユ帶鍒讹紙宸茶В闄7-2025闄愬埗锛?
      DISABLE_WRITES_FOR_BATCHES: ${DISABLE_WRITES_FOR_BATCHES:-}
    # 閫氳繃鐜鍙橀噺 BATCH_CODE 鎺у埗鐗╁寲鎵规锛岄粯璁7-2025
    command: ["python", "scripts/batch_processor_entrypoint.py"]
    volumes:
      - ./logs:/app/logs
      - ./reports:/app/reports
    networks:
      - converged-network
    depends_on:
      - app
    profiles:
      - batch

  # 鏁版嵁楠岃瘉鏈嶅姟
  validator:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: converged-validator
    restart: no
    environment:
      DATABASE_URL: ${DATABASE_URL:-mysql+pymysql://root:mysql_Lujing2022@117.72.14.166:23506/appraisal_test?charset=utf8mb4}
      PYTHONPATH: /app
    command: ["python", "final_validation_report.py"]
    volumes:
      - ./reports:/app/reports
    networks:
      - converged-network
    depends_on:
      - app
    profiles:
      - validation

  # Redis缂撳瓨鏈嶅姟锛堝彲閫夛級
  redis:
    image: redis:7-alpine
    container_name: converged-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - converged-network
    command: redis-server --appendonly yes
    profiles:
      - cache

  # Nginx鍙嶅悜浠ｇ悊锛堝彲閫夛級
  nginx:
    image: nginx:alpine
    container_name: converged-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    networks:
      - converged-network
    depends_on:
      - app
    profiles:
      - production

networks:
  converged-network:
    driver: bridge

volumes:
  redis-data:
    driver: local
